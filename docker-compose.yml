services:
  db:
    image: postgres:16
    container_name: not_movies_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: notmovies
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: not_movies
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: