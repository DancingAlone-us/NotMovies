<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (function() {
        const stored = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme:dark)');
        const theme = stored || (systemPrefersDark ? 'dark' :'light');
        document.documentElement.setAttribute('data-bs-theme', theme);
      })();
    </script>
    {% block head %} {% endblock %}
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/static/css/app.css" />
    <script src="/static/js/app.js/"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <!--Navbar-->
    <div class="navbar navbar-expand-lg py-1">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
          <span class="fw-bold">NM</span>
          <span class="">Not Movies</span>
        </a>

        <button
          class="navbar-toggler border-0 bg-dark text-white"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span><i class="bi bi-list fs-1 text white"></i></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-lg-end"
          id="mainNavbar"
        >
          <ul class="navbar-nav gap-lg-3 text-center pt-1 pt-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('index') }}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('browse') }}">Browse</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('index') }}"
                >Feeling Lucky?</a
              >
            </li>
            <li class="nav-item">
              <a
                class="btn bg-dark text-white px-3 py-2"
                href="{{ url_for('signup') }}"
                >Sign Up</a
              >
            </li>

            <li class="nav-item">
              <button id = 'themeToggle' class="btn btn-sm btn-outline-secondary mt-1" type="button" aria-label="Toggle dark Mode">
                <i class="bi bi-moon" id="themeIcon"></i>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>

    {% block main %} {% endblock %}

    <!--CTA-->
    <div
      class="cta d-flex flex-wrap justify-content-between align-items-center gap-2 px-5 py-4 bg-dark-subtle"
    >
      <div class="logo p-2">
        <span class="fs-4 fw-bold">Not Movies</span>
      </div>
      <div class="buttons d-flex flex-wrap justify-content-center gap-2">
        <a
          href="{{ url_for('index') }}"
          class="btn bg-dark text-white px-3 py-2"
          >Home</a
        >
        <a
          href="{{ url_for('browse') }}"
          class="btn bg-white text-dark px-3 py-2"
          >Browse</a
        >
      </div>
    </div>

    <!--Footer-->
    <div class="footer text-center px-3 py-4">
      <h1 class="fs-3 fw-bold">Not Movies</h1>
      <p class="fs-6 mb-0">Disclaimer</p>
    </div>
  </body>
</html>
